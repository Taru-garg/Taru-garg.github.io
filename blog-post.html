<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post - Taru Garg</title>
    <link

      type="image/x-icon"
      href="/assets/image/personal_optimized.png"
    />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js"
      integrity="sha512-7x3zila4t2qNycrtZ31HO0NnJr8kg2VI67YLoRSyi9hGhRN66FHYWr7Axa9Y1J9tGYHVBPqIjSE1ogHrJTz51g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css"
    />
    <link rel="stylesheet" href="./assets/css/blog-post.css" />
    <script src="assets/js/blog-post.js"></script>
  </head>

  <script

  <body class="bg-gray-100">
    <nav
      id="navbar"
      class="navbar fixed top-0 left-0 right-0 z-50 bg-white bg-opacity-90 py-3 px-4"
    >
      <div
        class="navbar-container container max-w-screen-xl mx-auto flex items-center justify-between"
      >
        <!-- Logo -->
        <div class="flex items-center">
          <a href="index.html">
            <img
              src="assets/image/navbar-logo.png"
              alt="Logo"
              class="navbar-logo"
            />
          </a>
        </div>

        <!-- Right side buttons -->
        <div class="flex items-center space-x-3">
          <a href="blogs.html">
            <button
              class="navbar-button px-5 py-2 bg-white font-medium text-gray-700 text-sm rounded-md hover:bg-gray-700 hover:text-white transition ease-linear duration-300 border border-gray-200"
            >
              All Blogs
            </button>
          </a>
          <a
            href="assets/files/Resume_Taru_Garg_2025.pdf"
            download="Resume_Taru_Garg"
          >
            <button
              class="navbar-button px-5 py-2 bg-white font-medium text-gray-700 text-sm rounded-md hover:bg-gray-700 hover:text-white transition ease-linear duration-300 border border-gray-200"
            >
              Get my CV
            </button>
          </a>
          <a href="index.html">
            <button
              class="navbar-button px-5 py-2 bg-gray-700 font-medium text-white text-sm rounded-md hover:bg-gray-800 transition ease-linear duration-300"
            >
              Home
            </button>
          </a>
        </div>
      </div>
    </nav>

    <!-- Loading indicator -->
    <div id="loading" class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-700 mx-auto"
        ></div>
        <p class="mt-4 text-gray-600">Loading blog post...</p>
      </div>
    </div>

    <!-- Error state -->
    <div
      id="error"
      class="min-h-screen flex items-center justify-center"
      style="display: none"
    >
      <div class="text-center">
        <div
          class="w-20 py-6 flex justify-center bg-red-100 rounded-md mb-4 mx-auto"
        >
          <i data-feather="alert-circle" class="text-red-500"></i>
        </div>
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">
          Blog Post Not Found
        </h2>
        <p class="text-gray-600 mb-6">
          The blog post you're looking for doesn't exist or couldn't be loaded.
        </p>
        <a
          href="blogs.html"
          class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
        >
          <i data-feather="arrow-left" class="mr-2 w-4 h-4"></i>
          Back to Blogs
        </a>
      </div>
    </div>

    <!-- Blog post content -->
    <article id="blog-article" class="pt-20 pb-12" style="display: none">
      <div class="container max-w-4xl mx-auto px-4">
        <!-- Back button -->
        <div class="mb-8">
          <a
            href="blogs.html"
            class="inline-flex items-center text-blue-600 hover:text-blue-800 transition-colors"
          >
            <i data-feather="arrow-left" class="mr-2 w-4 h-4"></i>
            Back to all posts
          </a>
        </div>

        <!-- Blog header -->
        <header class="mb-8">
          <h1
            id="blog-title"
            class="text-4xl md:text-5xl font-bold text-gray-900 mb-4"
          ></h1>

          <div class="flex flex-wrap items-center gap-4 text-gray-600 mb-6">
            <div class="flex items-center">
              <i data-feather="calendar" class="w-4 h-4 mr-2"></i>
              <span id="blog-date"></span>
            </div>
            <div class="flex items-center">
              <i data-feather="clock" class="w-4 h-4 mr-2"></i>
              <span id="blog-read-time"></span> min read
            </div>
          </div>

          <div id="blog-tags" class="mb-6">
            <!-- Tags will be inserted here -->
          </div>

          <div
            id="blog-excerpt"
            class="text-xl text-gray-600 font-medium mb-8 border-l-4 border-blue-500 pl-4"
          >
            <!-- Excerpt will be inserted here -->
          </div>
        </header>

        <!-- Blog content -->
        <div
          id="blog-content"
          class="blog-content bg-white rounded-lg shadow-sm border border-gray-200 p-8"
        >
          <!-- Markdown content will be rendered here -->
        </div>

        <!-- Share buttons -->
        <div class="mt-8 pt-8 border-t border-gray-200">
          <h3 class="text-lg font-semibold text-gray-800 mb-4">
            Share this post
          </h3>
          <div class="flex space-x-4">
            <button
              onclick="sharePost('twitter')"
              class="flex items-center px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors"
            >
              <i class="fab fa-twitter mr-2"></i>
              Twitter
            </button>
            <button
              onclick="sharePost('linkedin')"
              class="flex items-center px-4 py-2 bg-blue-700 text-white rounded-md hover:bg-blue-800 transition-colors"
            >
              <i class="fab fa-linkedin mr-2"></i>
              LinkedIn
            </button>
            <button
              onclick="sharePost('copy')"
              class="flex items-center px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors"
            >
              <i data-feather="link" class="mr-2 w-4 h-4"></i>
              Copy Link
            </button>
          </div>
        </div>
      </div>
    </article>

    <!-- Footer -->
    <section class="text-white py-6 mt-8">
      <div class="container mx-auto text-center">
        <div class="flex justify-center space-x-6 mt-4">
          <!-- GitHub Icon -->
          <a
            href="https://github.com/Taru-garg"
            target="_blank"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fab fa-github fa-lg"></i>
          </a>

          <!-- Email Icon -->
          <a
            href="mailto:tarugarg2@gmail.com"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-envelope fa-lg"></i>
          </a>

          <!-- Phone Icon -->
          <a href="tel:+918708694544" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-phone fa-lg"></i>
          </a>

          <!-- LinkedIn Icon -->
          <a
            href="https://www.linkedin.com/in/taru-garg/"
            target="_blank"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fab fa-linkedin fa-lg"></i>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
