<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs - Taru Garg</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/image/personal_optimized.png"
    />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js"
      integrity="sha512-7x3zila4t2qNycrtZ31HO0NnJr8kg2VI67YLoRSyi9hGhRN66FHYWr7Axa9Y1J9tGYHVBPqIjSE1ogHrJTz51g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="./assets/js/index.js"></script>
    <script src="./assets/js/blogs.js"></script>
  </head>

  <body class="bg-gray-100">
    <nav
      id="navbar"
      class="navbar fixed top-0 left-0 right-0 z-50 bg-white bg-opacity-90 py-3 px-4"
    >
      <div
        class="navbar-container container max-w-screen-xl mx-auto flex items-center justify-between"
      >
        <!-- Logo -->
        <div class="flex items-center">
          <a href="index.html">
            <img
              src="assets/image/navbar-logo.png"
              alt="Logo"
              class="navbar-logo"
            />
          </a>
        </div>

        <!-- Right side buttons -->
        <div class="flex items-center space-x-3">
          <a
            href="assets/files/Resume_Taru_Garg_2024_W10.pdf"
            download="Resume_Taru_Garg"
          >
            <button
              class="navbar-button px-5 py-2 bg-white font-medium text-gray-700 text-sm rounded-md hover:bg-gray-700 hover:text-white transition ease-linear duration-300 border border-gray-200"
            >
              Get my CV
            </button>
          </a>
          <a href="index.html">
            <button
              class="navbar-button px-5 py-2 bg-gray-700 font-medium text-white text-sm rounded-md hover:bg-gray-800 transition ease-linear duration-300"
            >
              Home
            </button>
          </a>
        </div>
      </div>
    </nav>

    <!-- Header Section - Reduced padding -->
    <section class="py-8 md:py-12">
      <div class="container max-w-screen-xl mx-auto px-4">
        <div class="text-center mt-16">
          <h1
            class="font-normal text-gray-900 text-4xl md:text-7xl leading-none mb-6"
          >
            Blog Posts
          </h1>

          <p class="font-normal text-gray-600 text-md md:text-xl mb-8">
            Thoughts on software engineering, performance optimization, and
            building tools.
          </p>
        </div>
      </div>
    </section>

    <!-- Loading indicator -->
    <div id="loading" class="text-center py-6">
      <div class="container max-w-screen-xl mx-auto px-4">
        <div class="flex justify-center items-center">
          <div
            class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-700"
          ></div>
          <span class="ml-3 text-gray-600">Loading blog posts...</span>
        </div>
      </div>
    </div>

    <!-- Search and Filter Section -->
    <section class="py-4" id="search-section" style="display: none">
      <div class="container max-w-screen-xl mx-auto px-4">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
          <div class="flex flex-col md:flex-row gap-4 items-center">
            <!-- Search Input -->
            <div class="flex-1 w-full md:w-auto">
              <div class="relative">
                <input
                  type="text"
                  id="blog-search"
                  placeholder="Search blog posts..."
                  class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                />
                <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
              </div>
            </div>
            
            <!-- Tag Filter -->
            <div class="w-full md:w-auto">
              <select
                id="tag-filter"
                class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
              >
                <option value="">All Tags</option>
              </select>
            </div>
            
            <!-- Sort Options -->
            <div class="w-full md:w-auto">
              <select
                id="sort-filter"
                class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
              >
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="title-asc">Title A-Z</option>
                <option value="title-desc">Title Z-A</option>
              </select>
            </div>
            
            <!-- Posts per page -->
            <div class="w-full md:w-auto">
              <select
                id="posts-per-page"
                class="px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
              >
                <option value="6">6 per page</option>
                <option value="9">9 per page</option>
                <option value="12">12 per page</option>
                <option value="18">18 per page</option>
              </select>
            </div>
          </div>
          
          <!-- Results Info -->
          <div class="mt-4 flex justify-between items-center text-sm text-gray-600">
            <div id="results-info">
              <!-- Results count will be displayed here -->
            </div>
            <button
              id="clear-filters"
              class="text-blue-600 hover:text-blue-800 transition-colors"
              style="display: none"
            >
              Clear all filters
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Blog Posts Section - Reduced padding -->
    <section class="py-4 md:py-6" id="blogs-section" style="display: none">
      <div class="container max-w-screen-xl mx-auto px-4">
        <div
          id="blog-posts-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
        >
          <!-- Blog posts will be dynamically inserted here -->
        </div>
        
        <!-- Pagination -->
        <div id="pagination" class="flex justify-center items-center mt-8 space-x-2">
          <!-- Pagination will be dynamically inserted here -->
        </div>

        <!-- No posts message -->
        <div id="no-posts" class="text-center py-16" style="display: none">
          <div class="bg-gray-50 px-8 py-12 rounded-md">
            <div
              class="w-20 py-6 flex justify-center bg-gray-100 rounded-md mb-4 mx-auto"
            >
              <i data-feather="edit-3" class="text-gray-400"></i>
            </div>
            <h4 class="font-medium text-gray-700 text-lg mb-4">
              No Blog Posts Yet
            </h4>
            <p class="font-normal text-gray-500 text-md">
              Blog posts will appear here once they're added to the assets/blogs
              directory.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <section class="text-white py-6 mt-8">
      <div class="container mx-auto text-center">
        <div class="flex justify-center space-x-6 mt-4">
          <!-- GitHub Icon -->
          <a
            href="https://github.com/Taru-garg"
            target="_blank"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fab fa-github fa-lg"></i>
          </a>

          <!-- Email Icon -->
          <a
            href="mailto:tarugarg2@gmail.com"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fas fa-envelope fa-lg"></i>
          </a>

          <!-- Phone Icon -->
          <a href="tel:+918708694544" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-phone fa-lg"></i>
          </a>

          <!-- Linkedin Icon -->
          <a
            href="https://www.linkedin.com/in/taru-garg/"
            target="_blank"
            class="text-gray-400 hover:text-gray-600"
          >
            <i class="fab fa-linkedin fa-lg"></i>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
